# Secrets and LLM settings come only from .env (env_file), never from the shell that runs compose,
# so a key exported in your terminal for another project can't leak into this stack.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://kb:kb@postgres:5432/kb
  REDIS_URL: redis://redis:6379/0
  MCP_SERVER_URL: http://mcp:8001/mcp
  AUTH_ISSUER_URL: http://api:8000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: base }
    env_file: [{ path: .env, required: true }]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  mcp:
    build: { context: ., target: base }
    command: ["python", "-m", "app.mcp_server"]
    env_file: [{ path: .env, required: true }]
    environment:
      <<: *app-env
      MCP_PUBLIC_URL: http://mcp:8001/mcp
      MCP_ALLOWED_HOSTS: "mcp:*,localhost:*,127.0.0.1:*"
    ports: ["8001:8001"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    ports: ["3000:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://kb:kb@postgres:5432/kb
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MCP_SERVER_URL: http://mcp:8001/mcp
  AUTH_ISSUER_URL: http://api:8000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: base }
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  mcp:
    build: { context: ., target: base }
    command: ["python", "-m", "app.mcp_server"]
    environment:
      <<: *app-env
      MCP_PUBLIC_URL: http://mcp:8001/mcp
      MCP_ALLOWED_HOSTS: "mcp:*,localhost:*,127.0.0.1:*"
    ports: ["8001:8001"]
    depends_on:
      api: { condition: service_healthy }

  ui:
    build: { context: ., target: ui }
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:

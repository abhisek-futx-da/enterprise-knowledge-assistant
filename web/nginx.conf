server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 11m;  # API enforces 10 MB; this only stops larger bodies early

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;       # stream agent steps (SSE) as they happen
    proxy_read_timeout 300s;
  }

  # `expires`, not add_header: an add_header here would silently drop the security headers above.
  location /assets/ {
    expires max;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
